name: EP-daily-task

on:

  workflow_dispatch: # 手动触发
  schedule:
    # cron 用 UTC，北京时间 = UTC + 8，所以要拿目标时间减 8 小时再填。
    # 05:40(北京) - 8h = 21:40(UTC)  →  每天北京 05:40 触发，5:45 前后推完
    # 故意不用整点（:00），整点是全球调度最挤的时刻，容易排到几小时后
    - cron: '40 21 * * *'

jobs:
  run-EP-tool:

    runs-on: ubuntu-latest

    steps:
    
    # 输出服务器的IP
    #- name: IP
    #  run: sudo curl ifconfig.me

    # 设置服务器时区为东八区 
    - name: Set time zone
      run: sudo timedatectl set-timezone 'Asia/Shanghai'

    # 检出，就是官方社区贡献的用来拉取仓库分支的 Action，你不需要考虑安装 git 命令工具，只需要把分支参数传入即可。
    - name: Checkout
      uses: actions/checkout@v4

    # Python 环境
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        
    #- name: Install dependencies
    #  run: |
    ##    python -m pip install --upgrade pip
    #    pip install requests json
    #    if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    # 安装脚本所需的依赖
    - name: Install requests
      run: pip install requests

    - name: Install dependencies
      run: pip install -r requirements.txt
    
    - name: Install lxml
      run: pip install lxml
      
    # 安装 aiohttp（异步并发） - 新闻联播脚本优化所需
    - name: Install aiohttp
      run: pip install aiohttp
      
    # 安装 tenacity（重试机制） - 新闻联播脚本优化所需
    - name: Install tenacity
      run: pip install tenacity
      
    # 运行脚本
    - name: 'Working1'
      env:  # 添加环境变量
        SENIVERSE_API_KEY: ${{ secrets.SENIVERSE_API_KEY }}
        PUSHPLUSSCKEY: ${{ secrets.PUSHPLUSSCKEY }}
        SERVERSCKEY: ${{ secrets.SERVERSCKEY }}
        COOLSCKEY: ${{ secrets.COOLSCKEY }}
        QMSGSCKEY: ${{ secrets.QMSGSCKEY }}
      # run: python weather.py
      run: python weather-new.py
      
    # 运行脚本
    - name: 'Working2'
      env:  # 添加环境变量
        PUSHPLUSSCKEY: ${{ secrets.PUSHPLUSSCKEY }}
      run: python news_plus.py
      
    # 运行脚本
    #- name: 'Working3'
    #  env:  # 添加环境变量
    #    PUSHPLUSSCKEY: ${{ secrets.PUSHPLUSSCKEY }}
    #  run: python epidemicSsituation.py
